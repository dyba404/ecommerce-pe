# apps/backend/docker-compose.yml — Postgres+Redis locales para T1 (docs/14-infra-docker.md).
# Levantar: docker compose -p ecommerce up -d   (desde WSL: wsl.exe -e bash -lc "cd /mnt/c/Users/Administrator/Documents/projects/ecommerce/apps/backend && docker compose -p ecommerce up -d")
services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_dev   # solo dev local; prod via secret del deploy
      POSTGRES_DB: ecommerce
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  redisdata:
