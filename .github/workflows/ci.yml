name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck (storefront + backend)
        run: pnpm typecheck

      - name: Lint
        # check-env-variables.js (cargado por next lint) exige la publishable key.
        # Dummy para CI; el .env real vive solo local.
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_dummy
        run: pnpm lint
